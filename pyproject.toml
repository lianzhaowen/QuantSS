[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantss"
version = "0.1.0"
description = "A股量化投资数据管理框架 - 支持多数据源接入、本地存储和数据分析"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "QuantSS Team", email = "quantss@example.com"}
]
keywords = ["quantitative", "finance", "a-share", "stock", "investment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    # 数据库
    "duckdb>=1.0.0",
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0.0",
    
    # 数据处理
    "pyarrow>=15.0.0",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # 数据验证
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # 日志和工具
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    
    # 类型支持
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
tdx = [
    "pytdx>=1.72",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
all = [
    "quantss[web,tdx,dev]"
]

[project.urls]
Homepage = "https://github.com/quantss/quantss"
Documentation = "https://quantss.readthedocs.io"
Repository = "https://github.com/quantss/quantss.git"
Issues = "https://github.com/quantss/quantss/issues"

[project.scripts]
quantss = "quantss.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantss*", "stockweb*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
quantss = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports in __init__
"tests/*" = ["S101"]  # assert statements in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "pytdx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
